<!DOCTYPE html>
<html lang="en" data-theme="cute">
<head>
<meta charset="UTF-8">
<!--
  ============================================================
  PERSONALIZE ME — one-edit swap (V1 placeholder values below):
    1. NICKNAME: search "princess" → replace with her name
    2. CUTE COLORS: edit --cute-* variables in :root below
  ============================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c4b5fd">
<title>💖 Princess Blast — no ads, just fun</title>
<style>
:root{
  --cute-bg1:#f5f3ff; --cute-bg2:#ede9fe; --cute-grid:#ffffff;
  --cute-cell:#ede9fe; --cute-cell-border:#7c3aed;
  --cute-accent:#7c3aed; --cute-accent2:#6d28d9; --cute-text:#4c1d95;
  --cute-tray:#ffffff;
  --mid-bg1:#1a1025; --mid-bg2:#2a1b3d; --mid-grid:#241a35;
  --mid-cell:#4c3d78; --mid-cell-border:#8b7cc0;
  --mid-accent:#a78bfa; --mid-accent2:#7c3aed; --mid-text:#e9e4ff;
  --mid-tray:#201531;
  --classic-bg1:#0f172a; --classic-bg2:#1e293b; --classic-grid:#1e293b;
  --classic-cell:#334155; --classic-cell-border:#475569;
  --classic-accent:#f59e0b; --classic-accent2:#3b82f6; --classic-text:#f1f5f9;
  --classic-tray:#0f172a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;transition:background .3s;
}
html[data-theme="cute"] body{background:linear-gradient(160deg,var(--cute-bg1),var(--cute-bg2));color:var(--cute-text)}
html[data-theme="classic"] body{background:linear-gradient(160deg,var(--classic-bg1),var(--classic-bg2));color:var(--classic-text)}
html[data-theme="midnight"] body{background:linear-gradient(160deg,var(--mid-bg1),var(--mid-bg2));color:var(--mid-text)}
#app{width:100%;max-width:430px;padding:calc(8px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;flex:1}
header{display:flex;align-items:center;justify-content:space-between;gap:6px}
h1{font-size:1.25rem;margin:0;white-space:nowrap}
html[data-theme="classic"] h1{font-size:1.15rem}
.icon-btns{display:flex;gap:6px}
button.icon{
  border:2px solid transparent;border-radius:12px;width:38px;height:38px;font-size:1.1rem;
  cursor:pointer;background:rgba(255,255,255,.7);
}
html[data-theme="classic"] button.icon{background:#334155;color:#f1f5f9}
button.icon.off{opacity:.45;filter:grayscale(1)}
#scorebar{display:flex;gap:8px}
.score-card{flex:1;text-align:center;border-radius:14px;padding:6px;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(124,58,237,.15)}
html[data-theme="classic"] .score-card{background:#1e293b;box-shadow:none;border:1px solid #475569}
.score-card small{display:block;font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.score-card b{font-size:1.3rem}
#newbest{font-size:.7rem;color:#7c3aed;font-weight:700;min-height:1em}
html[data-theme="midnight"] #newbest{color:var(--mid-accent)}
#board-wrap{position:relative;width:100%}
#board{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  gap:4px;padding:8px;border-radius:16px;aspect-ratio:1/1;width:100%;
  touch-action:none;position:relative;
}
html[data-theme="cute"] #board{background:var(--cute-grid);box-shadow:0 6px 24px color-mix(in srgb,var(--cute-accent2) 25%,transparent)}
html[data-theme="classic"] #board{background:#0b1120;border:1px solid #475569}
html[data-theme="midnight"] #board{background:var(--mid-grid);border:1px solid var(--mid-cell-border);box-shadow:0 6px 24px color-mix(in srgb,var(--mid-accent2) 30%,transparent)}
.cell{border-radius:6px;aspect-ratio:1/1;transition:transform .08s,background .12s}
html[data-theme="cute"] .cell{background:var(--cute-cell);border:1px solid var(--cute-cell-border)}
html[data-theme="classic"] .cell{background:var(--classic-cell);border:1px solid var(--classic-cell-border)}
html[data-theme="midnight"] .cell{background:var(--mid-cell);border:1px solid var(--mid-cell-border)}
.cell.filled{border:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18),inset 2px 2px 0 rgba(255,255,255,.35)}
.cell.ghost-ok{outline:2px solid #22c55e;outline-offset:-2px;filter:brightness(1.15)}
.cell.ghost-bad{outline:2px solid #ef4444;outline-offset:-2px}
.cell.hint-glow{outline:3px solid #fbbf24;outline-offset:-3px;animation:hintPulse 1s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:1}50%{opacity:.55}}
.cell.clearing{animation:pop .18s ease}
@keyframes pop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.25);opacity:1}100%{transform:scale(0);opacity:0}}
.cell.drop-in{animation:drop .15s ease}
@keyframes drop{from{transform:scale(1.3)}to{transform:scale(1)}}
#tray{
  display:flex;justify-content:space-around;align-items:center;gap:6px;
  border-radius:16px;padding:10px 6px;min-height:96px;touch-action:none;
}
html[data-theme="cute"] #tray{background:var(--cute-tray);box-shadow:0 4px 16px color-mix(in srgb,var(--cute-accent2) 20%,transparent)}
html[data-theme="classic"] #tray{background:var(--classic-tray);border:1px solid #475569}
html[data-theme="midnight"] #tray{background:var(--mid-tray);border:1px solid var(--mid-cell-border)}
.tray-slot{flex:1;display:flex;align-items:center;justify-content:center;min-height:84px;border-radius:12px}
.tray-slot.selected{outline:3px dashed #7c3aed;outline-offset:2px}
html[data-theme="midnight"] .tray-slot.selected{outline-color:var(--mid-accent)}
.piece{display:grid;gap:3px;touch-action:none;cursor:grab}
.piece .pcell{width:22px;height:22px;border-radius:5px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18),inset 2px 2px 0 rgba(255,255,255,.35)}
.piece.used{visibility:hidden}
#drag-layer{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.92;display:none}
#drag-layer .pcell{width:30px;height:30px}
#combo-pop{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);
  font-size:2rem;font-weight:900;opacity:0;pointer-events:none;z-index:40;white-space:nowrap;
  text-shadow:0 2px 12px rgba(124,58,237,.5);
}
#combo-pop.show{animation:comboPop .9s ease forwards}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.particle{position:fixed;pointer-events:none;z-index:60;font-size:1.2rem;animation:floatUp .8s ease-out forwards;will-change:transform,opacity}
html[data-theme="classic"] .particle{text-shadow:0 0 8px currentColor,0 0 2px currentColor}
@keyframes floatUp{to{transform:translateY(-70px) rotate(20deg);opacity:0}}
.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);z-index:100;padding:20px;
}
.overlay.show{display:flex}
.card{background:#fff;border-radius:20px;padding:28px;text-align:center;max-width:320px;width:100%;color:#4c1d95;box-shadow:0 12px 40px rgba(0,0,0,.3);border:1px solid transparent}
html[data-theme="midnight"] .card{background:#241a35;color:var(--mid-text)}
.card h2{margin:0 0 6px}
.card .big{font-size:2.6rem;font-weight:900;color:#7c3aed}
html[data-theme="midnight"] .card .big{color:var(--mid-accent)}
.card p{margin:6px 0;color:#4c1d95}
html[data-theme="midnight"] .card p{color:var(--mid-text)}
.card button{
  margin-top:12px;border:none;border-radius:14px;padding:12px 28px;font-size:1.1rem;font-weight:700;
  background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;cursor:pointer;width:100%;
  transition-property:scale,opacity;transition-duration:150ms;transition-timing-function:ease-out;
}
.card button:not(:disabled):active{scale:.96}
footer{text-align:center;font-size:.7rem;opacity:.6}
#hint{font-size:.72rem;text-align:center;opacity:.65;min-height:1.2em}
/* issue 15 sketch: throwaway missions panel, theme-aware, classic untouched */
#missions{display:flex;flex-direction:column;gap:4px;border-radius:14px;padding:8px 10px;font-size:.78rem;background:rgba(255,255,255,.75)}
html[data-theme="classic"] #missions{background:#1e293b;border:1px solid #475569}
html[data-theme="midnight"] #missions{background:var(--mid-tray);border:1px solid var(--mid-cell-border)}
#missions .m-row{display:flex;justify-content:space-between;gap:8px}
#missions .m-done{font-weight:700}
/* personalization (issue 01): purple-led cute accents; classic theme below untouched */
html[data-theme="cute"] #newbest{color:var(--cute-accent)}
html[data-theme="cute"] .tray-slot.selected{outline-color:var(--cute-accent)}
html[data-theme="cute"] .score-card{box-shadow:0 2px 8px color-mix(in srgb,var(--cute-accent) 15%,transparent)}
html[data-theme="cute"] #combo-pop{text-shadow:0 2px 12px color-mix(in srgb,var(--cute-accent) 50%,transparent)}
html[data-theme="midnight"] .particle{color:var(--mid-accent);text-shadow:0 0 8px currentColor,0 0 2px currentColor}
html[data-theme="cute"] .card .big{color:var(--cute-accent)}
html[data-theme="cute"] .card p{color:var(--cute-text)}
html[data-theme="cute"] .card button{background:linear-gradient(135deg,var(--cute-accent),var(--cute-accent2))}
html[data-theme="midnight"] .score-card{background:#241a35;box-shadow:none;border:1px solid var(--mid-cell-border);color:var(--mid-text)}
html[data-theme="midnight"] .tray-slot.selected{outline-color:var(--mid-accent)}
html[data-theme="midnight"] #newbest{color:var(--mid-accent)}
html[data-theme="midnight"] #combo-pop{text-shadow:0 2px 12px color-mix(in srgb,var(--mid-accent) 60%,transparent)}
html[data-theme="midnight"] .card .big{color:var(--mid-accent)}
html[data-theme="midnight"] .card p{color:var(--mid-text)}
html[data-theme="midnight"] .card button{background:linear-gradient(135deg,var(--mid-accent2),#4c1d95)}
html[data-theme="midnight"] button.icon{background:#241a35;color:var(--mid-text);border-color:var(--mid-cell-border)}
@media (hover:hover){button.icon:hover{filter:brightness(1.06)}}
button.icon{transition-property:scale,opacity,filter;transition-duration:150ms;transition-timing-function:ease-out}
button.icon:not(:disabled):active{scale:.96}
@media (prefers-reduced-motion:reduce){.cell.clearing,.cell.drop-in,#combo-pop.show,.particle{animation:none}.particle{opacity:0}.card button,button.icon{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">💖 Princess Blast</h1>
    <div class="icon-btns">
      <button class="icon" id="btn-theme" title="Theme">🎀</button>
      <button class="icon" id="btn-sound" title="Sound">🔊</button>
      <button class="icon" id="btn-vib" title="Vibration">📳</button>
      <button class="icon" id="btn-pause" title="Pause">⏸️</button>
      <button class="icon" id="btn-restart" title="Restart">🔄</button>
    </div>
  </header>
  <div id="scorebar">
    <div class="score-card"><small>Score</small><b id="score">0</b></div>
    <div class="score-card"><small>Best 👑</small><b id="best">0</b></div>
  </div>
  <div id="newbest"></div>
  <div id="board-wrap">
    <div id="board" aria-label="game board"></div>
    <div id="combo-pop"></div>
  </div>
  <div id="hint">drag a piece onto the board ✨ or tap piece → tap board</div>
  <div id="missions" aria-label="missions sketch">
    <div class="m-row" id="m-lines">Clear 10 lines: 0/10</div>
    <div class="m-row" id="m-score">Score 500 in one run: 0/500</div>
    <div class="m-row" id="m-daily">Daily: play one run</div>
  </div>
  <div id="tray" aria-label="piece tray"></div>
  <footer>no ads · no trackers · made with 💖</footer>
</div>
<div id="drag-layer"></div>
<div class="overlay" id="ov-pause"><div class="card"><h2>⏸️ Paused</h2><p>take a breath, princess 💕</p><button id="btn-resume">Resume</button></div></div>
<div class="overlay" id="ov-over">
  <div class="card"><h2 id="over-emoji">💖 Game Over!</h2>
    <div class="big" id="final-score">0</div>
    <p>best: <b id="final-best">0</b></p><p id="over-msg"></p>
    <button id="btn-again">Play Again 💕</button>
  </div>
</div>
<script>
"use strict";
/* ============ PURE GAME LOGIC (no DOM/audio/storage) ============ */
const N = 8;
// [cells, weight] — cells are [r,c] offsets
const SHAPES = [
  {cells:[[0,0]],w:6},{cells:[[0,0],[0,1]],w:6},{cells:[[0,0],[1,0]],w:6},
  {cells:[[0,0],[0,1],[0,2]],w:6},{cells:[[0,0],[1,0],[2,0]],w:6},
  {cells:[[0,0],[0,1],[0,2],[0,3]],w:5},{cells:[[0,0],[1,0],[2,0],[3,0]],w:5},
  {cells:[[0,0],[0,1],[0,2],[0,3],[0,4]],w:3},{cells:[[0,0],[1,0],[2,0],[3,0],[4,0]],w:3},
  {cells:[[0,0],[0,1],[1,0],[1,1]],w:7},
  {cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]],w:2},
  {cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]],w:4},{cells:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]],w:4},
  {cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]].filter((_,i)=>i%3!==2),w:4},
  {cells:[[0,0],[1,0],[1,1]],w:5},{cells:[[0,0],[0,1],[1,0]],w:5},
  {cells:[[0,1],[1,0],[1,1]],w:5},{cells:[[0,0],[0,1],[1,1]],w:5},
  {cells:[[0,0],[1,0],[2,0],[2,1]],w:4},{cells:[[0,0],[0,1],[0,2],[1,0]],w:4},
  {cells:[[0,0],[0,1],[0,2],[1,2]],w:4},{cells:[[0,1],[1,1],[2,1],[2,0]],w:4},
  {cells:[[0,0],[0,1],[1,1],[1,2]],w:3},{cells:[[0,1],[0,2],[1,0],[1,1]],w:3},
  {cells:[[0,0],[1,0],[1,1],[2,1]],w:3},{cells:[[0,1],[1,0],[1,1],[2,0]],w:3},
  {cells:[[0,0],[0,1],[0,2],[1,1]],w:4},{cells:[[0,1],[1,0],[1,1],[1,2]],w:4},
  {cells:[[0,1],[1,0],[1,1],[2,1]],w:4},{cells:[[0,0],[1,0],[1,1],[2,0]],w:3},
  {cells:[[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[1,1],[1,2],[1,3],[1,4]],w:1},
];
const TOTAL_W = SHAPES.reduce((s,x)=>s+x.w,0);
function pickShape(rnd){
  let r = rnd()*TOTAL_W, i = 0;
  while(i < SHAPES.length-1 && (r -= SHAPES[i].w) >= 0) i++;
  return SHAPES[i].cells;
}
const emptyBoard = () => Array.from({length:N},()=>Array(N).fill(0));
function fits(board, cells, ar, ac){
  for(const [r,c] of cells){
    const rr=ar+r, cc=ac+c;
    if(rr<0||rr>=N||cc<0||cc>=N||board[rr][cc]) return false;
  }
  return true;
}
function fitsAnywhere(board, cells){
  const maxR=Math.max(...cells.map(c=>c[0])), maxC=Math.max(...cells.map(c=>c[1]));
  for(let r=0;r<=N-1-maxR;r++) for(let c=0;c<=N-1-maxC;c++) if(fits(board,cells,r,c)) return true;
  return false;
}
function fullLines(board){
  const rows=[], cols=[];
  for(let r=0;r<N;r++) if(board[r].every(v=>v)) rows.push(r);
  for(let c=0;c<N;c++){ let full=true; for(let r=0;r<N;r++) if(!board[r][c]){full=false;break;} if(full) cols.push(c); }
  return {rows, cols};
}
// transition: returns {cellsPlaced, clearedCells:[...], lines, gameOverAfter}
function applyPlacement(board, cells, ar, ac, color){
  for(const [r,c] of cells) board[ar+r][ac+c]=color;
  const {rows, cols} = fullLines(board);
  const cleared=[];
  for(const r of rows) for(let c=0;c<N;c++) cleared.push([r,c]);
  for(const c of cols) for(let r=0;r<N;r++) if(!rows.includes(r)) cleared.push([r,c]);
  for(const [r,c] of cleared) board[r][c]=0;
  return {cellsPlaced:cells.length, clearedCells:cleared, lines:rows.length+cols.length};
}
// issue 03 conformance seam: tray/game-over/streak/scoring rules, all pure
function trayIsEmpty(tray){ return tray.every(t=>!t||t.used); }
function gameOverFor(board, tray){
  const avail=tray.filter(t=>t&&!t.used);
  if(avail.length===0) return false; // empty tray refills first, never game over
  return !avail.some(t=>fitsAnywhere(board,t.cells));
}
function advanceStreak(streak, lines){ return lines>0 ? streak+1 : 0; }
function gainFor(cellsPlaced, clearedCount, lines, streakAfter){
  let g=cellsPlaced+clearedCount*10;
  if(lines>1) g+=(lines-1)*50;
  if(streakAfter>=2) g+=streakAfter*20;
  return g;
}
function isNewBest(score, best){ return score>best; }
// issue 16 missions seam: placement-derived mission event, pure (no DOM/audio/storage).
// Carries the reducer facts later mission progress reads: lines, clearedCount,
// streakAfter, boardCleared, plus the hand-computed score gain for this move.
function missionEventFor({lines, clearedCount, streakAfter, boardCleared, cellsPlaced}){
  return {
    lines, clearedCount, streakAfter, boardCleared,
    scoreGain: gainFor(cellsPlaced, clearedCount, lines, streakAfter),
    isClear: clearedCount>0
  };
}
// issue 16 missions seam: single-objective counter plus done flag from reducer events.
// A lines mission accrues cleared lines on clear events only; a score mission
// accrues every move gain including dry placements. Done stays done and the
// mission identity rides through untouched, so acknowledgment fires exactly once.
function missionProgressFor(mission, evt){
  const keep = () => ({...mission, done: mission.done});
  if(mission.done) return keep();
  const kind = mission.kind || 'lines';
  const delta = kind==='score' ? evt.scoreGain : (evt.isClear ? evt.lines : 0);
  if(!delta) return keep();
  const progress = Math.min(mission.target, mission.progress + delta);
  return {...mission, progress, done: progress>=mission.target};
}
// issue 16 dailies: device-local seed plus strict consecutive streak, pure.
// Seed is the device YYYY-MM-DD string, so the same date always maps to the
// same daily with no server clock and no UTC normalization. Streak counts
// strict consecutive calendar days: same day idempotent, next day plus one,
// any gap of two or more days resets to one on next completion.
// Keys sit beside existing bb_* keys; Classic keys stay untouched.
const MISSION_KEYS = {missions: 'bb_missions', dailies: 'bb_dailies'};
function dailySeedFor(year, month, day){
  const p = n => String(n).padStart(2, '0');
  return `${year}-${p(month)}-${p(day)}`;
}
function dailyStreakFor(state, todaySeed){
  if(state.lastDay === todaySeed) return {streak: state.streak, lastDay: todaySeed};
  const prev = new Date(state.lastDay + 'T00:00:00');
  const today = new Date(todaySeed + 'T00:00:00');
  if(isNaN(prev) || isNaN(today)) return {streak: 1, lastDay: todaySeed};
  const gapDays = Math.round((today - prev) / 86400000);
  if(gapDays === 1) return {streak: state.streak + 1, lastDay: todaySeed};
  return {streak: 1, lastDay: todaySeed};
}
function missionDoneFlipsFor(before, after){
  const doneById = {};
  for(const m of before) doneById[m.id] = m.done;
  return after.filter(m => m.done && !doneById[m.id]);
}
// issue 29 missions seam: one adapter step per placement, pure (no DOM/audio/storage).
// Advances every mission through the reducer event, advances the daily on a
// played run (clear or dry) via sketchDailyFor, and reports the missions that
// flipped to done this exact event so the adapter fires one acknowledgment.
function sketchAdvanceFor(missions, dailyState, evt, todaySeed){
  const after = missions.map(m => missionProgressFor(m, evt));
  const flips = missionDoneFlipsFor(missions, after);
  const daily = sketchDailyFor(dailyState, todaySeed);
  return {missions: after, flips, daily};
}
// issue 15 sketch: throwaway mission registry plus text, pure (no DOM/audio/storage).
// Two fixed missions (clear 10 lines, score 500 in one run) plus one daily slot,
// all driven by the #16 seam. Text is the only display contract the panel reads.
function sketchMissionsFor(){
  return [
    {id: 'sk-lines', kind: 'lines', target: 10, progress: 0, done: false},
    {id: 'sk-score', kind: 'score', target: 500, progress: 0, done: false},
  ];
}
function sketchDailyFor(state, todaySeed){
  const next = dailyStreakFor(state, todaySeed);
  return {seed: todaySeed, streak: next.streak, lastDay: next.lastDay};
}
function sketchTextFor(m){
  if(m.kind === 'daily') return m.done ? `Daily done — streak ${m.progress}` : 'Daily: play one run';
  if(m.kind === 'score') return m.done ? `Score ${m.target} in one run: done!` : `Score ${m.target} in one run: ${m.progress}/${m.target}`;
  return m.done ? `Clear ${m.target} lines: done!` : `Clear ${m.target} lines: ${m.progress}/${m.target}`;
}
// ---- issue 05 juice policy: pure caps + plans, no DOM/audio/storage ----
// CLEAR_MS/DROP_MS small so 180ms render matches SFX gap (doPlace), never block next placement.
// 60fps: CSS anims touch transform/opacity only (pop/drop/comboPop/floatUp).
// Sounds: triangle/sine, <=0.15 vol, >=60ms stagger -> never clip or stack harshly.
const JUICE = {
  CLEAR_MS: 180,      // .cell.clearing pop; render/endCheck wait this long
  DROP_MS: 150,       // .cell.drop-in
  COMBO_MS: 900,      // combo-pop hold (matches CSS comboPop .9s)
  PARTICLE_MAX: 18,   // hard cap so particles read without obscuring board
  PARTICLE_PER_CELL: 1,
  PARTICLE_PER_CELL_BIG: 2,
  VOICES_MAX: 5,      // stacked tones cap -> no clipping
  VOICE_WINDOW_MS: 600, // overlapping tones inside this window count as live
  STAGGER_MIN: 0.06,  // min delay gap between stacked tones (seconds)
  TONE_VOL: 0.15,     // unit voice ceiling
  COMBO_AT: 2,        // streak >= this fires combo callout + arpeggio
  ENCOURAGE_MS: 1500 // min gap between 'encourage' callouts: no spam on rapid small clears
};
// live voice ledger: timestamps (ms) of tones already scheduled inside the window
let liveVoices=[];
function voiceRoom(now){
  liveVoices=liveVoices.filter(t=>now-t<JUICE.VOICE_WINDOW_MS);
  return Math.max(0, JUICE.VOICES_MAX-liveVoices.length);
}
// Steal guarantee: a nonempty plan always returns >=1 voice.
// Window full -> drop the oldest live voice and hand its slot to the new plan's head.
function claimVoices(plan, now){
  if(!plan.length) return [];
  let room=voiceRoom(now);
  if(room===0){ liveVoices.sort((a,b)=>a-b); liveVoices.shift(); room=1; }
  const take=plan.slice(0, room);
  for(const t of take) liveVoices.push(now+t.delay*1000);
  return take;
}
// encouragement throttle: last timestamp an 'encourage' callout fired (adapter sets it)
let lastEncourageAt=-Infinity;
function encourageDue(now){ return now-lastEncourageAt>=JUICE.ENCOURAGE_MS; }
// total particle elements for a clear (capped); cute/classic themes share the cap
function particleCountFor(clearedCount, isBigClear){
  if(clearedCount<=0) return 0;
  return Math.min(JUICE.PARTICLE_MAX, clearedCount*(isBigClear?JUICE.PARTICLE_PER_CELL_BIG:JUICE.PARTICLE_PER_CELL));
}
// which cleared cells spawn a particle (evenly sampled when capped)
function pickParticleCells(clearedCells, count){
  if(clearedCells.length<=count) return clearedCells.slice();
  const out=[];
  for(let i=0;i<count;i++) out.push(clearedCells[Math.floor(i*clearedCells.length/count)]);
  return out;
}
// exactly one callout kind per clear, board-clear wins so callouts never double-fire
// returns: 'board-clear' | 'combo' | 'multi' | 'encourage' | null
function calloutKindFor({lines, streakAfter, boardCleared, clearedCount}){
  if(!clearedCount) return null;
  if(boardCleared) return 'board-clear';
  if(streakAfter>=JUICE.COMBO_AT) return 'combo';
  if(lines>1) return 'multi';
  return 'encourage';
}
// exact oscillator plan for one placement (pure: no AudioContext touched)
function soundPlanFor({lines, streakAfter, boardCleared}){
  const V=JUICE.TONE_VOL;
  if(boardCleared) return [523,659,784,1047].map((f,i)=>({freq:f,dur:.16,delay:+(i*.09).toFixed(2),type:'triangle',vol:.14}));
  if(streakAfter>=JUICE.COMBO_AT) return [0,1,2].map(i=>({freq:660+i*180+(streakAfter-JUICE.COMBO_AT)*40,dur:.12,delay:+(i*.06).toFixed(2),type:'triangle',vol:.14}));
  if(lines>0){
    const plan=[{freq:520,dur:.14,delay:0,type:'sine',vol:V}];
    for(let i=1;i<lines&&plan.length<JUICE.VOICES_MAX;i++) plan.push({freq:520+i*140,dur:.14,delay:+(i*.07).toFixed(2),type:'sine',vol:V});
    return plan;
  }
  return [{freq:420,dur:.1,delay:0,type:'sine',vol:V},{freq:630,dur:.12,delay:.06,type:'sine',vol:V}];
}
/* ============ ADAPTERS (DOM/audio/storage) ============ */
const $ = id => document.getElementById(id);
const CUTE_COLORS = ["#a855f7","#6d28d9","#fbbf24","#34d399","#60a5fa","#9333ea","#7c3aed"];
const CLASSIC_COLORS = ["#f59e0b","#3b82f6","#22c55e","#ef4444","#a855f7","#06b6d4","#f97316"];
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch{return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} }
};
let board, tray, score, best, streak, selected=-1, paused=false, over=false;
let soundOn, vibOn, theme;
let audioCtx=null;
const OSC_TYPES=["sine","triangle","square","sawtooth"];
function tone(freq, dur, delay=0, type="sine", vol=JUICE.TONE_VOL){
  type = OSC_TYPES.includes(type) ? type : "sine";
  vol = Math.min(vol, JUICE.TONE_VOL);
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+dur+.02);
  }catch{}
}
function playPlan(plan, now){ if(now===undefined) now=(typeof performance!=='undefined'?performance.now():Date.now()); for(const t of claimVoices(plan, now)) tone(t.freq, t.dur, t.delay, t.type, t.vol); }
const sfx = {
  select(){ tone(500,.07,0,"triangle",.08); },
  place(){ playPlan(soundPlanFor({lines:0,streakAfter:0,boardCleared:false})); },
  clear(lines){ playPlan(soundPlanFor({lines,streakAfter:0,boardCleared:false})); },
  combo(streak){ playPlan(soundPlanFor({lines:1,streakAfter:streak,boardCleared:false})); },
  fanfare(){ playPlan(soundPlanFor({lines:1,streakAfter:streak,boardCleared:true})); },
  bad(){ tone(180,.15,0,"sawtooth",.08); },
  over(){ playPlan([{freq:400,dur:.25,delay:0,type:'sine',vol:.15},{freq:300,dur:.25,delay:.22,type:'sine',vol:.15},{freq:200,dur:.4,delay:.44,type:'sine',vol:.15}]); }
};
const ENCOURAGE_CUTE=["Sweet!","Nice!","Amazing!","So good!","Brilliant!","Lovely!","Super!"];
const ENCOURAGE_CLASSIC=["Nice!","Great!","Excellent!","Brilliant!","Superb!","Well played!"];
function pickEncourage(){ const a=theme==="classic"?ENCOURAGE_CLASSIC:ENCOURAGE_CUTE; return a[Math.floor(Math.random()*a.length)]; }
let idleTimer=null;
const HINT_DEFAULT="drag a piece onto the board or tap piece then tap board";
function clearHint(){
  const glows=document.querySelectorAll(".cell.hint-glow");
  for(const e of glows) e.classList.remove("hint-glow");
  const h=$("hint"); if(h&&h.dataset.hint==="1"){ h.textContent=HINT_DEFAULT; h.dataset.hint=""; }
}
function pokeIdle(){
  clearTimeout(idleTimer); clearHint();
  idleTimer=setTimeout(()=>{
    if(paused||over||drag) return pokeIdle();
    const slot=tray.find(t=>t&&!t.used&&fitsAnywhere(board,t.cells));
    if(!slot) return;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(fits(board,slot.cells,r,c)){
        slot.cells.forEach(([dr,dc])=>cellAt(r+dr,c+dc).classList.add("hint-glow"));
        const h=$("hint"); h.textContent="psst - this one fits here"; h.dataset.hint="1";
        setTimeout(()=>{ clearHint(); pokeIdle(); },4000);
        return;
      }
    }
  },7000);
}
function buzz(p){ if(vibOn && navigator.vibrate) try{navigator.vibrate(p);}catch{} }
function palette(){ return theme==="classic"?CLASSIC_COLORS:CUTE_COLORS; }
function shapeBounds(cells){
  return {h:Math.max(...cells.map(c=>c[0]))+1, w:Math.max(...cells.map(c=>c[1]))+1};
}
/* ---- render ---- */
const boardEl=$("board"), trayEl=$("tray");
const cellEls=[];
for(let r=0;r<N;r++) for(let c=0;c<N;c++){
  const d=document.createElement("div"); d.className="cell"; d.dataset.r=r; d.dataset.c=c;
  boardEl.appendChild(d); cellEls.push(d);
}
const cellAt=(r,c)=>cellEls[r*N+c];
function renderBoard(dropCells){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const el=cellAt(r,c), v=board[r][c];
    el.className="cell"+(v?" filled":"");
    if(v) el.style.background=palette()[(v-1)%palette().length];
    else el.style.background="";
    if(dropCells && dropCells.some(([dr,dc])=>dr===r&&dc===c)) el.classList.add("drop-in");
  }
  $("score").textContent=score; $("best").textContent=best;
}
function renderTray(){
  trayEl.innerHTML="";
  tray.forEach((slot,i)=>{
    const s=document.createElement("div");
    s.className="tray-slot"+(selected===i?" selected":"");
    if(slot && !slot.used){
      const p=document.createElement("div");
      p.className="piece"; p.dataset.i=i;
      const {h,w}=shapeBounds(slot.cells);
      const px = h>4?13 : h>3?17 : 22;
      p.style.gridTemplateColumns=`repeat(${w},${px}px)`;
      p.style.gap = px<22?"2px":"3px";
      const grid=Array.from({length:h},()=>Array(w).fill(0));
      slot.cells.forEach(([r,c])=>grid[r][c]=1);
      grid.forEach(row=>row.forEach(v=>{
        const d=document.createElement("div");
        d.className="pcell"; d.style.width=d.style.height=px+"px";
        if(v){ d.style.background=palette()[(slot.color-1)%palette().length]; }
        else { d.style.background="transparent"; d.style.boxShadow="none"; }
        p.appendChild(d);
      }));
      s.appendChild(p);
    }
    trayEl.appendChild(s);
  });
}
function showCombo(text, emoji){
  const el=$("combo-pop");
  el.textContent=(emoji||"")+" "+text;
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
let liveParticles=0;
function particles(cells, isBigClear){
  const pal=palette();
  const room=Math.max(0, JUICE.PARTICLE_MAX-liveParticles);
  const spots=pickParticleCells(cells, Math.min(particleCountFor(cells.length, isBigClear), room));
  liveParticles+=spots.length;
  spots.forEach(([r,c])=>{
    const from=cellAt(r,c).getBoundingClientRect();
    const s=document.createElement("div");
    s.className="particle";
    s.textContent = theme==="classic" ? "✦" : ["💖","✨","⭐","💕"][Math.floor(Math.random()*4)];
    if(theme!=="classic") s.style.color=pal[Math.floor(Math.random()*pal.length)];
    s.style.left=(from.left+from.width/2+ (Math.random()*20-10))+"px";
    s.style.top=(from.top+from.height/2)+"px";
    document.body.appendChild(s);
    setTimeout(()=>{ s.remove(); liveParticles=Math.max(0,liveParticles-1); },850);
  });
}
/* ---- game flow ---- */
function newBatch(){
  tray=[0,1,2].map(()=>({cells:pickShape(Math.random), color:1+Math.floor(Math.random()*7), used:false}));
}
function checkGameOver(){ return gameOverFor(board, tray); }
function endCheck(){
  if(trayIsEmpty(tray)) newBatch();
  renderTray();
  if(checkGameOver()){
    over=true;
    clearTimeout(idleTimer); clearHint();
    const isBest = isNewBest(score, best);
    if(isBest){ best=score; store.set("bb_best",best); }
    renderBoard();
    setTimeout(()=>{
      $("final-score").textContent=score;
      $("final-best").textContent=best;
      $("over-msg").textContent = isBest ? "🎉 new best, princess! 🎉" : (theme==="classic"?"":theme==="midnight"?"so close, princess! one more? 🌙":"so close, princess! one more? 💕");
      $("over-emoji").textContent = theme==="classic"?"Game Over":theme==="midnight"?"💜 Game Over!":"💖 Game Over!";
      $("ov-over").classList.add("show");
      sfx.over(); buzz([100,50,100]);
    },450);
  }
}
function doPlace(slotIdx, ar, ac){
  const slot=tray[slotIdx];
  if(!slot||slot.used||paused||over) return false;
  if(!fits(board,slot.cells,ar,ac)){ sfx.bad(); return false; }
  const res=applyPlacement(board,slot.cells,ar,ac,slot.color);
  slot.used=true; selected=-1;
  streak = advanceStreak(streak, res.lines);
  score += gainFor(res.cellsPlaced, res.clearedCells.length, res.lines, streak);
  // strict combo: streak builds only on consecutive clearing placements, dry placement resets
  const boardCleared=res.lines>0&&board.every(row=>row.every(v=>!v));
  const evt=missionEventFor({lines:res.lines,clearedCount:res.clearedCells.length,streakAfter:streak,boardCleared,cellsPlaced:res.cellsPlaced});
  const flips = advanceSketchMissions(evt); // issue 15 sketch: thin adapter, events only
  const missionFlipped = flips.length > 0;
  if(res.clearedCells.length){
    res.clearedCells.forEach(([r,c])=>cellAt(r,c).classList.add("clearing"));
    particles(res.clearedCells, res.lines>1||boardCleared);
    playPlan(soundPlanFor(evt)); // one plan per clear: never clips or stacks harshly
    const now=(typeof performance!=='undefined'?performance.now():Date.now());
    if(missionFlipped){ // issue 29: done flip wins the single callout, exactly once
      showCombo('Mission complete!', theme==="classic"?"spark":"heart"); buzz([30,40,30]);
    } else switch(calloutKindFor(evt)){ // exactly one callout per clear: never double-fires
      case 'board-clear': showCombo(theme==="classic"?"BOARD CLEAR!":"Board Clear!", theme==="classic"?"spark":theme==="midnight"?"star":"star"); buzz([50,50,50,50,80]); break;
      case 'combo': showCombo("Combo x"+streak+"!", theme==="classic"?"fire":"heart"); buzz([30,40,30]); break;
      case 'multi': showCombo(res.lines+" lines!", "spark"); buzz([30,40,30]); break;
      case 'encourage': if(encourageDue(now)){ lastEncourageAt=now; showCombo(pickEncourage(), theme==="classic"?"spark":"heart"); buzz(25); } break;
    }
  } else if(missionFlipped){ // issue 29: dry done flip still acknowledged, single callout
    playPlan(soundPlanFor({lines: 1, streakAfter: JUICE.COMBO_AT, boardCleared: false}));
    showCombo('Mission complete!', theme==="classic"?"spark":"heart"); buzz([30,40,30]);
  } else { sfx.place(); buzz(10); }
  if(isNewBest(score,best)){ best=score; store.set("bb_best",best); $("newbest").textContent="🎉 new best!"; }
  if(res.clearedCells.length) setTimeout(()=>{ renderBoard(); endCheck(); }, JUICE.CLEAR_MS);
  else { renderBoard(slot.cells.map(([r,c])=>[ar+r,ac+c])); endCheck(); }
  renderTray();
  pokeIdle();
  return true;
}
function reset(){
  board=emptyBoard(); score=0; streak=0; selected=-1; paused=false; over=false;
  clearTimeout(idleTimer); clearHint();
  $("newbest").textContent="";
  $("ov-over").classList.remove("show"); $("ov-pause").classList.remove("show");
  resetSketchRun(); // issue 15 sketch: per-run missions reset, daily streak persists
  newBatch(); renderBoard(); renderTray(); renderSketchMissions(); pokeIdle();
}
/* ---- issue 15 sketch: thin missions adapter (events in, text out) ---- */
let sketchMissions=sketchMissionsFor(), sketchDaily={seed:'',streak:0,lastDay:''};
function todaySeed(){ const n=new Date(); return dailySeedFor(n.getFullYear(), n.getMonth()+1, n.getDate()); }
function loadSketch(){
  const seed=todaySeed();
  sketchMissions=store.get(MISSION_KEYS.missions, sketchMissionsFor());
  const saved=store.get(MISSION_KEYS.dailies, {streak:0,lastDay:''});
  sketchDaily={seed, streak:saved.streak, lastDay:saved.lastDay};
}
function resetSketchRun(){
  sketchMissions=sketchMissionsFor();
  store.set(MISSION_KEYS.missions, sketchMissions);
  renderSketchMissions();
}
function advanceSketchMissions(evt){
  const seed = sketchDaily.seed || todaySeed();
  const next = sketchAdvanceFor(sketchMissions, {streak: sketchDaily.streak, lastDay: sketchDaily.lastDay}, evt, seed);
  const changed = next.missions.some((m, i) => m.progress !== sketchMissions[i].progress || m.done !== sketchMissions[i].done)
    || next.daily.streak !== sketchDaily.streak || next.daily.lastDay !== sketchDaily.lastDay;
  sketchMissions = next.missions;
  sketchDaily = next.daily;
  store.set(MISSION_KEYS.missions, sketchMissions);
  store.set(MISSION_KEYS.dailies, {streak: sketchDaily.streak, lastDay: sketchDaily.lastDay});
  if(changed) renderSketchMissions();
  return next.flips;
}
function renderSketchMissions(){
  const L=$("m-lines"), S=$("m-score"), D=$("m-daily");
  if(!L||!S||!D) return;
  const byId=Object.fromEntries(sketchMissions.map(m=>[m.id,m]));
  L.textContent=sketchTextFor(byId['sk-lines']);
  S.textContent=sketchTextFor(byId['sk-score']);
  D.textContent=sketchDaily.streak>0
    ? sketchTextFor({id:'sk-daily',kind:'daily',target:1,progress:1,done:true,streak:sketchDaily.streak})
    : sketchTextFor({id:'sk-daily',kind:'daily',target:1,progress:0,done:false});
  for(const [el,m] of [[L,byId['sk-lines']],[S,byId['sk-score']]]) el.classList.toggle('m-done', !!m.done);
  D.classList.toggle('m-done', sketchDaily.streak>0);
}
/* ---- input: drag + tap fallback ---- */
const dragLayer=$("drag-layer");
let drag=null; // {slotIdx, cells, color, moved, pid}
function boardAnchorFromPoint(clientX, clientY, cells){
  const rect=boardEl.getBoundingClientRect();
  const cellW=rect.width/N;
  const {h,w}=shapeBounds(cells);
  // lift piece above finger so it's visible
  const lift = cellW*2.2;
  const cx=clientX-rect.left, cy=(clientY-lift)-rect.top;
  const ar=Math.round(cy/cellW - h/2), ac=Math.round(cx/cellW - w/2);
  return {ar,ac};
}
function paintGhost(ar,ac,cells){
  document.querySelectorAll(".cell.ghost-ok,.cell.ghost-bad").forEach(e=>e.classList.remove("ghost-ok","ghost-bad"));
  const ok=fits(board,cells,ar,ac);
  cells.forEach(([r,c])=>{
    const rr=ar+r,cc=ac+c;
    if(rr>=0&&rr<N&&cc>=0&&cc<N) cellAt(rr,cc).classList.add(ok?"ghost-ok":"ghost-bad");
  });
  return ok;
}
function clearGhost(){ document.querySelectorAll(".cell.ghost-ok,.cell.ghost-bad").forEach(e=>e.classList.remove("ghost-ok","ghost-bad")); }
function rejectInvalid(ar,ac,cells){
  sfx.bad(); buzz(40);
  for(const [r,c] of cells){
    const rr=ar+r, cc=ac+c;
    if(rr>=0&&rr<N&&cc>=0&&cc<N) cellAt(rr,cc).classList.add("ghost-bad");
  }
  setTimeout(clearGhost,250);
}
function mountDragGhost(slot){
  dragLayer.innerHTML="";
  const {h,w}=shapeBounds(slot.cells);
  dragLayer.style.display="block";
  dragLayer.style.gridTemplateColumns=`repeat(${w},30px)`;
  dragLayer.style.display="grid"; dragLayer.style.gap="3px";
  const grid=Array.from({length:h},()=>Array(w).fill(0));
  slot.cells.forEach(([r,c])=>grid[r][c]=1);
  grid.forEach(row=>row.forEach(v=>{
    const d=document.createElement("div");
    d.className="pcell";
    if(v){ d.style.background=palette()[(slot.color-1)%palette().length]; }
    else { d.style.background="transparent"; d.style.boxShadow="none"; }
    dragLayer.appendChild(d);
  }));
}
trayEl.addEventListener("pointerdown",e=>{
  const p=e.target.closest(".piece");
  if(!p||paused||over) return;
  e.preventDefault();
  pokeIdle();
  const i=+p.dataset.i;
  drag={slotIdx:i,cells:tray[i].cells,color:tray[i].color,moved:false,ar:0,ac:0,prevSelected:selected};
  selected=-1;
  mountDragGhost(tray[i]);
  try{trayEl.setPointerCapture(e.pointerId);}catch{}
});
trayEl.addEventListener("pointermove",e=>{
  if(!drag) return;
  drag.moved=true;
  dragLayer.style.left=(e.clientX-40)+"px";
  dragLayer.style.top=(e.clientY-110)+"px";
  const {ar,ac}=boardAnchorFromPoint(e.clientX,e.clientY,drag.cells);
  drag.ar=ar; drag.ac=ac;
  paintGhost(ar,ac,drag.cells);
});
function endDrag(e){
  if(!drag) return;
  const d=drag; drag=null;
  dragLayer.style.display="none";
  clearGhost();
  if(d.moved){
    if(fits(board,d.cells,d.ar,d.ac)) doPlace(d.slotIdx,d.ar,d.ac);
    else {
      // invalid over board: shared reject; fully off-board: silent cancel
      if(d.cells.some(([r,c])=>{ const rr=d.ar+r, cc=d.ac+c; return rr>=0&&rr<N&&cc>=0&&cc<N; }))
        rejectInvalid(d.ar,d.ac,d.cells);
      selected=d.prevSelected; renderTray();
    }
  } else {
    // simple tap: select / deselect
    selected = selected===d.slotIdx ? -1 : d.slotIdx;
    renderTray(); sfx.select();
  }
}
trayEl.addEventListener("pointerup",endDrag);
trayEl.addEventListener("pointercancel",()=>{ if(drag) selected=drag.prevSelected; drag=null; dragLayer.style.display="none"; clearGhost(); renderTray(); });
boardEl.addEventListener("pointerdown",e=>{
  if(selected<0||paused||over) return;
  const t=e.target.closest(".cell");
  if(!t) return;
  e.preventDefault();
  pokeIdle();
  const tr=+t.dataset.r, tc=+t.dataset.c;
  const slot=tray[selected];
  // forgiving anchor: try every offset where tapped cell maps to a piece cell
  for(const [pr,pc] of slot.cells){
    const ar=tr-pr, ac=tc-pc;
    if(fits(board,slot.cells,ar,ac)){ doPlace(selected,ar,ac); return; }
  }
  rejectInvalid(tr,tc,[[0,0]]);
});

$("btn-restart").onclick=()=>{ reset(); sfx.select(); };
$("btn-again").onclick=()=>{ reset(); sfx.select(); };
document.addEventListener("pointerdown",()=>{ if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume(); },{passive:true});
// block double-tap zoom / scroll fights
document.addEventListener("touchmove",e=>{ if(e.target.closest("#board,#tray")) e.preventDefault(); },{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
/* ---- init ---- */
theme=store.get("bb_theme","cute");
soundOn=store.get("bb_sound",true);
vibOn=store.get("bb_vib",true);
best=store.get("bb_best",0);
loadSketch(); // issue 15 sketch: missions plus daily from namespaced keys
$("btn-sound").classList.toggle("off",!soundOn); $("btn-sound").textContent=soundOn?"🔊":"🔇";
$("btn-vib").classList.toggle("off",!vibOn);
reset();
applyTheme();
renderSketchMissions(); // issue 15 sketch: first paint shows missions
$("best").textContent=best;
</script>
</body>
</html>
